<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#3b2414">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Globetrotter">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&family=Noto+Color+Emoji&display=swap" rel="stylesheet">
<title>Globetrotter – Jorda rundt med ryggsekk</title>
<style>
/* VOICE: lekent eventyr-reisespill · IDEA: en reisedagbok og et skolekart · PICTURE: det politiske verdenskartet
   COLOUR: lys sjø, pastell-land, dyp brun skinnramme, rødt stempel-aksent · TYPE: Fredoka + Nunito
   LAYOUT: PC – stort kart til venstre, reisepanel til høyre; mobil – kart øverst, panel under */
:root{color-scheme:light;--sea:#bfe3f3;--ink:#2a2018;--muted:#7a6a58;--paper:#fbf6ea;--card:#ffffff;--line:#e8dcc4;--leather:#3b2414;--leather2:#5a3a22;--red:#c8372d;--red2:#8f2219;--green:#1f8a55;--green2:#136338;--blue:#2470a8;--blue2:#174d75;--gold:#f2b53a;
 --emoji:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;--font:"Nunito",system-ui,"Segoe UI",Roboto,sans-serif;--head:"Fredoka","Nunito",system-ui,sans-serif}
.fl{font-family:var(--emoji);font-style:normal}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:16px/1.5 var(--font);color:var(--ink);background:radial-gradient(1200px 600px at 20% 0%,#5a3a22,#24150b)}
button{font:inherit;cursor:pointer;color:var(--ink)}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.hidden{display:none!important}

/* ---------- START ---------- */
#start{min-height:100%;display:flex;align-items:center;justify-content:center;padding:16px}
.card{background:var(--paper);border-radius:22px;box-shadow:0 20px 60px #0009,inset 0 0 0 6px #fff6,inset 0 0 0 7px var(--line);padding:26px 24px;max-width:540px;width:100%}
.globe{font-size:64px;text-align:center;display:block;font-family:var(--emoji);animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(6deg)}}
.logo{font-family:var(--head);font-size:clamp(30px,10vw,48px);font-weight:700;text-align:center;color:var(--red);margin:4px 0 0;letter-spacing:1px;line-height:1.05}
.sub{text-align:center;color:var(--muted);margin:4px 0 16px;font-weight:700}
.langs{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.langbtn{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 18px;font-weight:800;min-height:42px}
.langbtn.on{background:var(--leather);color:#fbe9c4;border-color:var(--leather)}
label{font-weight:800;display:block;margin-bottom:6px}
input[type=text]{width:100%;padding:13px 14px;font:inherit;font-size:17px;border:2px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
input[type=text]:focus{outline:none;border-color:var(--gold)}
.btn{display:block;width:100%;padding:13px;margin-top:10px;border:none;border-radius:14px;font-family:var(--head);font-size:19px;font-weight:600;color:#fff;background:var(--red);box-shadow:0 4px 0 var(--red2);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--red2)}
.btn.green{background:var(--green);box-shadow:0 4px 0 var(--green2)}
.btn.blue{background:var(--blue);box-shadow:0 4px 0 var(--blue2)}
.btn.gray{background:#8d7c66;box-shadow:0 4px 0 #5f5243}
.btn:disabled{opacity:.45;cursor:not-allowed}
.how{font-size:14px;line-height:1.55;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 16px;margin-top:16px}
.how h3{margin:0 0 4px;font-family:var(--head);font-weight:600}
.credit{text-align:center;font-size:13px;color:var(--muted);margin-top:16px;font-weight:800;letter-spacing:1px}
.hs{font-size:14px;margin-top:12px}.hs ol{margin:4px 0;padding-left:22px}

/* ---------- SPILL: layout ---------- */
#game{height:100%;display:grid;grid-template-rows:auto auto 1fr;max-width:1500px;margin:0 auto;background:var(--paper)}
#top{display:flex;align-items:center;gap:10px;background:var(--leather);color:#fbe9c4;padding:8px 12px;flex-wrap:wrap}
#top .brand{font-family:var(--head);font-weight:700;font-size:20px;margin-right:auto;white-space:nowrap}
#top .stat{background:#ffffff14;border:1px solid #ffffff22;border-radius:999px;padding:4px 11px;font-weight:800;font-size:14px;white-space:nowrap}
#musicBtn{color:#fbe9c4;cursor:pointer}
#mapbox{position:relative;border-bottom:3px solid var(--leather)}
#mapwrap{overflow:auto;background:var(--sea);height:44vh;-webkit-overflow-scrolling:touch}
#map{display:block;height:auto}
#panel{overflow:auto;padding:14px}
@media(min-width:900px){
 #game{grid-template-columns:1fr 400px;grid-template-rows:auto 1fr}
 #top{grid-column:1/3}
 #mapbox{border-bottom:none;border-right:3px solid var(--leather)}
 #mapwrap{height:100%}
 #panel{padding:18px}
}
@media(max-width:600px){#top .brand,#sName{display:none}#top{display:grid;grid-template-columns:repeat(5,auto);justify-content:space-between;gap:4px;padding:6px 8px}#top .stat{font-size:12px;padding:3px 7px;text-align:center}#mapwrap{height:40vh}.place .flag{font-size:36px}.place h2{font-size:22px}}

/* kart */
.land{stroke:#8aa0ad;stroke-width:.6;stroke-linejoin:round}
.land.real{stroke:#ffffff;stroke-width:.35}
.grid{stroke:#ffffffaa;stroke-width:.4}
.eq{stroke:#d9534f88;stroke-dasharray:5 4;stroke-width:.7}
.ocean{fill:#5f93b3;font-size:9px;font-style:italic;letter-spacing:3px;font-family:Georgia,serif;pointer-events:none}
.ocean.small{font-size:7px;letter-spacing:1px}
.city{cursor:pointer}
.city .hit{fill:transparent}
.city .dot{fill:var(--red);stroke:#fff;stroke-width:1.3}
.city.small .dot{fill:#e98b2a;stroke-width:1}
.city.visited .dot{fill:var(--green)}
.city.here .dot{fill:var(--gold);stroke:#2a2018;stroke-width:1.8}
.lbl{font:800 10px var(--font);fill:#2a2018;paint-order:stroke;stroke:#fff;stroke-width:3px;pointer-events:none}
.ring{fill:none;stroke-width:2.5;animation:pulse 1.4s ease-in-out infinite}
.ring.buy{stroke:#f2b53a}.ring.drop{stroke:#2ecc71}
@keyframes pulse{50%{stroke-opacity:.25}}
.route{stroke:#2a2018;stroke-opacity:.35;stroke-width:1.5;stroke-dasharray:4 4;fill:none}
.route.done{stroke:var(--red);stroke-opacity:1;stroke-dasharray:none;stroke-width:2}
#plane{font-family:var(--emoji)}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:42px;height:42px;border-radius:12px;border:none;background:#fff;font-size:22px;font-weight:800;box-shadow:0 3px 10px #0003}
.zoom button:disabled{opacity:.4}
#travelbar{position:absolute;left:10px;right:62px;top:10px;background:#fffffff0;border-radius:14px;padding:10px 14px;box-shadow:0 4px 14px #0003;display:flex;align-items:center;gap:12px}
#travelbar .tb-ic{font-size:28px;font-family:var(--emoji)}
#travelbar .tb-t{flex:1;font-weight:800;font-size:14px}
#travelbar .tb-bar{height:8px;border-radius:8px;background:#eadfca;margin-top:6px;overflow:hidden}
#travelbar .tb-bar i{display:block;height:100%;width:0;background:var(--red);border-radius:8px}
#travelbar button{border:none;background:var(--leather);color:#fbe9c4;border-radius:10px;padding:8px 12px;font-weight:800;min-height:40px}

/* panel */
.place{display:flex;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px 14px;box-shadow:0 2px 0 var(--line)}
.place .flag{font-size:44px;line-height:1;font-family:var(--emoji)}
.place h2{margin:0;font-family:var(--head);font-weight:700;font-size:26px;line-height:1.1}
.place small{color:var(--muted);font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.pill{font-size:12px;font-weight:800;background:#f5ecd9;border-radius:999px;padding:2px 9px;white-space:nowrap}
.stay{margin-top:10px;background:#fff;border:1px dashed var(--line);border-radius:14px;padding:9px 12px;font-size:13.5px;font-weight:700;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.stay .ok{color:var(--green)}.stay .no{color:var(--red)}
#actions{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:12px}
.act{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 4px 9px;text-align:center;font-weight:800;font-size:12.5px;line-height:1.2;box-shadow:0 3px 0 var(--line);transition:transform .08s,box-shadow .08s}
.act span{display:block;font-size:26px;margin-bottom:4px;font-family:var(--emoji)}
.act:hover{border-color:#d7c39c}
.act:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.act.badge::after{content:"!";position:absolute;top:-6px;right:-6px;background:var(--red);color:#fff;border-radius:50%;width:22px;height:22px;line-height:22px;font-size:13px}
@media(min-width:900px){#actions{grid-template-columns:1fr 1fr}.act{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;font-size:15px}.act span{margin:0;font-size:24px}}
@media(max-width:380px){.act{font-size:11px}.act span{font-size:22px}}
#diary{margin-top:12px;background:#fff8e6;border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:12px;padding:10px 12px;font-size:14px;font-style:italic;min-height:40px}

/* ---------- MODAL ---------- */
#modal{position:fixed;inset:0;background:#1d120acc;display:flex;align-items:center;justify-content:center;padding:12px;z-index:10;backdrop-filter:blur(2px)}
#mbox{background:var(--paper);border-radius:22px;max-width:540px;width:100%;max-height:92vh;overflow:auto;padding:20px;position:relative;box-shadow:0 20px 60px #000a}
#mbox h2{margin:0 36px 10px 0;font-family:var(--head);font-weight:700;color:var(--red);line-height:1.2}
#mclose{position:absolute;top:10px;right:10px;width:40px;height:40px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:20px;color:var(--muted)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:12px;margin:6px 0}
.row .small{font-size:13px;color:var(--muted)}
.small{font-size:13px;color:var(--muted)}
.mini{padding:9px 13px;border:none;border-radius:10px;font-weight:800;color:#fff;background:var(--green);white-space:nowrap;min-height:40px}
.mini.red{background:var(--red)}.mini.blue{background:var(--blue)}.mini.gray{background:#8d7c66}
.mini:disabled{opacity:.4}
.ans{display:block;width:100%;text-align:left;margin:8px 0;padding:13px 14px;border:2px solid var(--line);border-radius:14px;background:#fff;font-size:16px;font-weight:700}
.ans.ok{background:#d3f1de;border-color:var(--green)}
.ans.bad{background:#f7d2cd;border-color:var(--red)}
.q{font-size:19px;font-weight:800;margin:8px 0;font-family:var(--head)}
.fact{background:#fff;border:1px solid var(--line);padding:12px 14px;border-radius:14px;line-height:1.55}
.stamps{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.stamp{border:3px dashed var(--red);border-radius:12px;padding:6px;text-align:center;font-size:12px;font-weight:800;color:var(--red);transform:rotate(-4deg);background:#fff8}
.stamp:nth-child(even){transform:rotate(3deg);border-color:var(--blue);color:var(--blue)}
.stamp .f{font-size:26px;font-family:var(--emoji)}
.stamp.empty{border-color:#d9d0c0;color:#b9ad9a;transform:none}
.mission{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;margin:8px 0}
.mission b{color:var(--red)}
.tag{display:inline-block;font-size:12px;font-weight:800;padding:2px 9px;border-radius:999px;background:#f5ecd9;margin:2px 4px 2px 0}
.big{font-size:22px;text-align:center;font-weight:800;font-family:var(--head)}
.sec{margin:16px 0 8px;font-family:var(--head);font-weight:600;color:var(--leather2)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.facts div{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.facts span{display:block;font-size:12px;color:var(--muted);font-weight:700}
.jobs{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.jobcard{background:#fff;border:1px solid var(--line);border-radius:16px;padding:12px 8px;text-align:center;box-shadow:0 3px 0 var(--line)}
.jobcard span{display:block;font-size:32px;font-family:var(--emoji)}
.jobcard b{display:block;margin:4px 0;font-family:var(--head);font-weight:600}
.jobcard small{color:var(--muted);font-size:12px;font-weight:700}
.jobcard:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:800;min-height:38px}
.chip.on{background:var(--leather);color:#fbe9c4;border-color:var(--leather)}
.cvc{background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:8px 0}
.cvc h4{margin:0 0 6px;font-family:var(--head);font-weight:600}
.cvc li{margin:3px 0}
#toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:20;opacity:0;transition:opacity .3s;pointer-events:none;max-width:90%;text-align:center}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="start">
  <div class="card">
    <span class="globe">🌍</span>
    <h1 class="logo">GLOBETROTTER</h1>
    <p class="sub" id="tSub">Jorda rundt med ryggsekk</p>
    <div class="langs"><button class="langbtn" data-l="no">Norsk</button><button class="langbtn" data-l="en">English</button></div>
    <label for="pname" id="tName">Hva heter du, reisende?</label>
    <input type="text" id="pname" maxlength="16" placeholder="Skriv navnet ditt">
    <button class="btn" id="newBtn">🎒 Start ny reise</button>
    <button class="btn green hidden" id="contBtn">▶ Fortsett reisen</button>
    <div class="how" id="tHow"></div>
    <div class="hs" id="hsBox"></div>
    <div class="credit">Wåle production 2026</div>
  </div>
</div>

<div id="game" class="hidden">
  <div id="top">
    <span class="brand">🌍 Globetrotter</span>
    <span class="stat" id="sName">🎒</span>
    <span class="stat" id="sMoney">💰</span>
    <span class="stat" id="sDay">📅</span>
    <span class="stat" id="sDone">📦</span>
    <span class="stat" id="sStamps">🛂</span>
    <button class="stat" id="musicBtn">🎵</button>
  </div>
  <div id="mapbox">
    <div id="mapwrap"><svg id="map" viewBox="0 0 1000 395"></svg></div>
    <div class="zoom"><button id="zIn" aria-label="Zoom inn">+</button><button id="zOut" aria-label="Zoom ut">−</button></div>
    <div id="travelbar" class="hidden"><span class="tb-ic" id="tbIc">✈️</span><div class="tb-t"><div id="tbText"></div><div class="tb-bar"><i id="tbBar"></i></div></div><button id="tbSkip">⏭</button></div>
  </div>
  <div id="panel">
    <div class="place"><span class="flag" id="cFlag"></span><div><h2 id="cName"></h2><small id="cSub"></small><div class="pills" id="cPills"></div></div></div>
    <div class="stay" id="stay"></div>
    <div id="actions">
      <button class="act" data-a="about"><span>📖</span>Om landet</button>
      <button class="act" data-a="job"><span>💼</span>Ta en jobb</button>
      <button class="act" data-a="market"><span>🛒</span>Marked</button>
      <button class="act" data-a="board" id="boardBtn"><span>📌</span>Oppdrag</button>
      <button class="act" data-a="travel"><span>✈️</span>Reis</button>
      <button class="act" data-a="bag"><span>🎒</span>Ryggsekk</button>
      <button class="act" data-a="pass"><span>🛂</span>Passet</button>
      <button class="act" data-a="cv"><span>📄</span>CV</button>
      <button class="act" data-a="home"><span>📞</span>Ring hjem</button>
      <button class="act" data-a="menu"><span>⚙️</span>Meny</button>
    </div>
    <div id="diary"></div>
  </div>
</div>

<div id="modal" class="hidden"><div id="mbox"><button id="mclose" aria-label="Lukk">✕</button><div id="mcontent"></div></div></div>
<div id="toast"></div>

{id:"bergen",cc:"NO",la:60.39,lo:5.32,lm:"EA",port:1,pr:120,
 no:{n:"Bergen",item:"Bryggen-hus i tre",fact:"Bergen var Norges hovedstad på 1200-tallet og en viktig hansaby. De fargerike trehusene på Bryggen står på UNESCOs verdensarvliste. Byen er kjent for å ha regn nesten 240 dager i året, og fra Fløyen ser du hele byen mellom de sju fjellene."},
 en:{n:"Bergen",item:"Wooden Bryggen house",fact:"Bergen was Norway's capital in the 1200s and an important Hanseatic town. The colourful wooden houses of Bryggen are a UNESCO World Heritage Site. The city is famous for rain almost 240 days a year, and from Mount Fløyen you can see the whole city between the seven mountains."}},
{id:"tromso",cc:"NO",la:69.65,lo:18.96,lm:"EA",port:1,pr:140,
 no:{n:"Tromsø",item:"Nordlys-postkort",fact:"Tromsø kalles «Nordens Paris» og ligger langt nord for polarsirkelen. Om vinteren er sola borte i to måneder (mørketid), og om sommeren går den aldri ned (midnattssol). Her ser du ofte nordlyset danse på himmelen. Polfarere som Roald Amundsen startet ekspedisjonene sine herfra."},
 en:{n:"Tromsø",item:"Northern lights postcard",fact:"Tromsø is called «the Paris of the North» and lies far north of the Arctic Circle. In winter the sun disappears for two months (the polar night), and in summer it never sets (the midnight sun). The northern lights often dance in the sky here. Polar explorers like Roald Amundsen started their expeditions from here."}},
{id:"kiruna",cc:"SE",la:67.86,lo:20.23,lm:"EA",port:0,pr:160,
 no:{n:"Kiruna",item:"Jernmalm-stein",fact:"Kiruna er Sveriges nordligste by og har verdens største underjordiske jernmalmgruve. Fordi gruva får bakken til å sige, flyttes hele sentrum flere kilometer østover – også den gamle trekirken! I nærheten ligger det berømte Ishotellet i Jukkasjärvi."},
 en:{n:"Kiruna",item:"Iron ore stone",fact:"Kiruna is Sweden's northernmost town and has the world's largest underground iron ore mine. Because the mine makes the ground sink, the whole town centre is being moved several kilometres east – including the old wooden church! The famous Icehotel in Jukkasjärvi is nearby."}},
{id:"edinburgh",cc:"GB",la:55.95,lo:-3.19,lm:"EA",port:1,pr:180,
 no:{n:"Edinburgh",item:"Skotsk skjørt (kilt)",fact:"Edinburgh er hovedstaden i Skottland. Over byen troner Edinburgh Castle på en gammel vulkan. Hver august holdes verdens største kunstfestival her. J.K. Rowling skrev deler av den første Harry Potter-boka på kafeer i Edinburgh."},
 en:{n:"Edinburgh",item:"Scottish kilt",fact:"Edinburgh is the capital of Scotland. Edinburgh Castle towers over the city on an old volcano. Every August the world's largest arts festival is held here. J.K. Rowling wrote parts of the first Harry Potter book in cafés in Edinburgh."}},
{id:"nice",cc:"FR",la:43.70,lo:7.27,lm:"EA",port:1,pr:200,
 no:{n:"Nice",item:"Lavendelpose",fact:"Nice ligger på den franske Rivieraen ved Middelhavet. Den lange strandpromenaden heter Promenade des Anglais, fordi rike engelskmenn overvintret her på 1800-tallet. Like ved ligger bystaten Monaco, og i Provence vokser store lavendelåkre."},
 en:{n:"Nice",item:"Lavender bag",fact:"Nice lies on the French Riviera by the Mediterranean. The long seaside promenade is called the Promenade des Anglais, because rich English people spent the winter here in the 1800s. The city-state of Monaco is nearby, and big lavender fields grow in Provence."}},
{id:"munchen",cc:"DE",la:48.14,lo:11.58,lm:"EA",port:0,pr:150,
 no:{n:"München",item:"Lederhose",fact:"München er hovedstad i delstaten Bayern. Byen er kjent for Oktoberfest, fotballklubben Bayern München og bilmerket BMW. Ikke langt unna ligger eventyrslottet Neuschwanstein og Alpene."},
 en:{n:"Munich",item:"Lederhosen",fact:"Munich is the capital of the state of Bavaria. The city is famous for Oktoberfest, the football club Bayern Munich and the car brand BMW. The fairy-tale castle of Neuschwanstein and the Alps are not far away."}},
{id:"barcelona",cc:"ES",la:41.39,lo:2.17,lm:"EA",port:1,pr:170,
 no:{n:"Barcelona",item:"Gaudí-flis",fact:"Barcelona er hovedstaden i Catalonia, der mange snakker katalansk. Arkitekten Antoni Gaudí tegnet den fantastiske kirken Sagrada Família, som de har bygd på siden 1882. Byen arrangerte sommer-OL i 1992 og er hjem til FC Barcelona."},
 en:{n:"Barcelona",item:"Gaudí tile",fact:"Barcelona is the capital of Catalonia, where many people speak Catalan. The architect Antoni Gaudí designed the amazing Sagrada Família church, which has been under construction since 1882. The city hosted the 1992 Summer Olympics and is home to FC Barcelona."}},
{id:"venezia",cc:"IT",la:45.44,lo:12.33,lm:"EA",port:1,pr:230,
 no:{n:"Venezia",item:"Gondol-modell",fact:"Venezia er bygd på over 100 små øyer i en lagune, med kanaler i stedet for gater. Folk reiser med båt og gondol, og det finnes over 400 broer. Venezia var en mektig handelsrepublikk i tusen år, og Marco Polo reiste herfra helt til Kina."},
 en:{n:"Venice",item:"Gondola model",fact:"Venice is built on over 100 small islands in a lagoon, with canals instead of streets. People travel by boat and gondola, and there are over 400 bridges. Venice was a powerful trading republic for a thousand years, and Marco Polo travelled from here all the way to China."}},
{id:"goreme",cc:"TR",la:38.64,lo:34.83,lm:"EA",port:0,pr:130,
 no:{n:"Kappadokia",item:"Keramikkfat",fact:"I Kappadokia står rare steinsøyler kalt «eventyrpiper», formet av vind og regn. Folk har hugget ut hus, kirker og til og med hele underjordiske byer i det myke fjellet. Hver morgen svever hundrevis av luftballonger over landskapet."},
 en:{n:"Cappadocia",item:"Ceramic plate",fact:"In Cappadocia strange rock pillars called «fairy chimneys» stand, shaped by wind and rain. People have carved houses, churches and even whole underground cities into the soft rock. Every morning hundreds of hot-air balloons float over the landscape."}},
{id:"stpetersburg",cc:"RU",la:59.94,lo:30.31,lm:"EA",port:1,pr:200,
 no:{n:"St. Petersburg",item:"Fabergé-egg (kopi)",fact:"St. Petersburg ble grunnlagt av tsar Peter den store i 1703 og var Russlands hovedstad i 200 år. I Vinterpalasset ligger Eremitasjen, et av verdens største kunstmuseer. Om sommeren er det «hvite netter» da det nesten aldri blir mørkt."},
 en:{n:"St Petersburg",item:"Fabergé egg (replica)",fact:"St Petersburg was founded by Tsar Peter the Great in 1703 and was Russia's capital for 200 years. The Winter Palace houses the Hermitage, one of the world's largest art museums. In summer there are «white nights» when it hardly gets dark."}},
{id:"luxor",cc:"EG",la:25.69,lo:32.64,lm:"EA",port:0,pr:140,
 no:{n:"Luxor",item:"Alabastkrukke",fact:"Luxor ligger der den gamle byen Theben lå, Egypts hovedstad for over 3000 år siden. Her finnes Karnak-tempelet, et av verdens største tempelanlegg, og på andre siden av Nilen ligger Kongenes dal med faraoenes graver – også Tutankhamons."},
 en:{n:"Luxor",item:"Alabaster jar",fact:"Luxor stands where the ancient city of Thebes was, Egypt's capital over 3000 years ago. Here you find Karnak Temple, one of the world's largest temple complexes, and across the Nile lies the Valley of the Kings with the pharaohs' tombs – including Tutankhamun's."}},
{id:"mombasa",cc:"KE",la:-4.04,lo:39.67,lm:"EA",port:1,pr:110,
 no:{n:"Mombasa",item:"Kokosnøttfigur",fact:"Mombasa er Kenyas eldste by og største havn, med hvite strender ved Indiahavet. Portugiserne bygde Fort Jesus her i 1593. Byen har vært et møtested for afrikansk, arabisk og indisk kultur i hundrevis av år, og her snakkes mye swahili."},
 en:{n:"Mombasa",item:"Coconut figure",fact:"Mombasa is Kenya's oldest city and largest port, with white beaches on the Indian Ocean. The Portuguese built Fort Jesus here in 1593. The city has been a meeting place for African, Arab and Indian culture for hundreds of years, and a lot of Swahili is spoken here."}},
{id:"agra",cc:"IN",la:27.18,lo:78.01,lm:"EA",port:0,pr:180,
 no:{n:"Agra",item:"Taj Mahal-miniatyr",fact:"I Agra står Taj Mahal, bygd av stormogulen Shah Jahan som et gravmæle for kona Mumtaz. Det tok rundt 20 000 arbeidere over 20 år å bygge det. Marmoren skifter farge – rosa om morgenen, hvit om dagen og gyllen i måneskinn."},
 en:{n:"Agra",item:"Taj Mahal miniature",fact:"Agra is home to the Taj Mahal, built by the Mughal emperor Shah Jahan as a tomb for his wife Mumtaz. It took around 20,000 workers over 20 years to build. The marble changes colour – pink in the morning, white in the day and golden in moonlight."}},
{id:"goa",cc:"IN",la:15.50,lo:73.83,lm:"EA",port:1,pr:90,
 no:{n:"Goa",item:"Kasjunøtter",fact:"Goa er Indias minste delstat og var portugisisk koloni i over 450 år, helt til 1961. Derfor finnes det hvite kirker og portugisisk mat her. I dag er Goa kjent for palmestrender og avslappede strandkafeer."},
 en:{n:"Goa",item:"Cashew nuts",fact:"Goa is India's smallest state and was a Portuguese colony for over 450 years, until 1961. That is why there are white churches and Portuguese food here. Today Goa is famous for palm beaches and relaxed beach cafés."}},
{id:"shanghai",cc:"CN",la:31.23,lo:121.47,lm:"EA",port:1,pr:160,
 no:{n:"Shanghai",item:"Silkevifte",fact:"Shanghai er Kinas største by og har verdens travleste containerhavn. Langs elvepromenaden The Bund står gamle europeiske bygninger, og på andre siden reiser skyskraperne seg i Pudong – blant dem Shanghai Tower på 632 meter. Byens magnettog kjører i over 400 km/t."},
 en:{n:"Shanghai",item:"Silk fan",fact:"Shanghai is China's largest city and has the world's busiest container port. Along the riverside Bund stand old European buildings, and across the river the skyscrapers of Pudong rise up – including the 632-metre Shanghai Tower. The city's maglev train runs at over 400 km/h."}},
{id:"kyoto",cc:"JP",la:35.01,lo:135.77,lm:"JP",port:0,pr:200,
 no:{n:"Kyoto",item:"Geisha-vifte",fact:"Kyoto var Japans hovedstad i over 1000 år og har rundt 2000 templer og helligdommer. Det gylne tempelet Kinkaku-ji og de tusenvis av oransje toriiportene ved Fushimi Inari er verdenskjente. I bydelen Gion kan man fortsatt se geishaer."},
 en:{n:"Kyoto",item:"Geisha fan",fact:"Kyoto was Japan's capital for over 1000 years and has around 2000 temples and shrines. The golden temple Kinkaku-ji and the thousands of orange torii gates at Fushimi Inari are world famous. In the Gion district you can still see geishas."}},
{id:"phuket",cc:"TH",la:7.88,lo:98.39,lm:"EA",port:1,pr:90,
 no:{n:"Phuket",item:"Skjellhalskjede",fact:"Phuket er Thailands største øy og et populært feriested for nordmenn. Øya har hvite strender, turkist hav og kalksteinsklipper som stiger rett opp av sjøen i Phang Nga-bukta. Før turismen tjente øya penger på tinn og gummi."},
 en:{n:"Phuket",item:"Shell necklace",fact:"Phuket is Thailand's largest island and a popular holiday spot. The island has white beaches, turquoise sea and limestone cliffs rising straight out of the water in Phang Nga Bay. Before tourism, the island earned its money from tin and rubber."}},
{id:"cairns",cc:"AU",la:-16.92,lo:145.77,lm:"AU",port:1,pr:150,
 no:{n:"Cairns",item:"Korallformet glass",fact:"Cairns er porten til Great Barrier Reef, verdens største korallrev, som kan sees fra verdensrommet. Like ved ligger Daintree, en av verdens eldste regnskoger. Her lever også store saltvannskrokodiller, så pass deg ved elvene!"},
 en:{n:"Cairns",item:"Coral-shaped glass",fact:"Cairns is the gateway to the Great Barrier Reef, the world's largest coral reef, which can be seen from space. Nearby is the Daintree, one of the world's oldest rainforests. Big saltwater crocodiles live here too, so be careful by the rivers!"}},
{id:"queenstown",cc:"NZ",la:-45.03,lo:168.66,lm:"NZ",port:0,pr:180,
 no:{n:"Queenstown",item:"Strikkhopp-T-skjorte",fact:"Queenstown kalles verdens eventyrhovedstad. Her ble det kommersielle strikkhoppet startet i 1988, og man kan også stå på ski, rafte og hoppe i fallskjerm. Byen ligger ved innsjøen Wakatipu med fjellene The Remarkables i bakgrunnen."},
 en:{n:"Queenstown",item:"Bungee T-shirt",fact:"Queenstown is called the adventure capital of the world. Commercial bungee jumping started here in 1988, and you can also ski, raft and skydive. The town lies by Lake Wakatipu with the Remarkables mountains in the background."}},
{id:"sanfrancisco",cc:"US",la:37.77,lo:-122.42,lm:"AM",port:1,pr:180,
 no:{n:"San Francisco",item:"Golden Gate-modell",fact:"San Francisco er kjent for den røde Golden Gate-broen, bratte bakker og gamle kabeltrikker. Ute i bukta ligger fengselsøya Alcatraz. Like sør for byen ligger Silicon Valley, der selskaper som Apple og Google holder til. I 1906 ble byen ødelagt av et stort jordskjelv."},
 en:{n:"San Francisco",item:"Golden Gate model",fact:"San Francisco is famous for the red Golden Gate Bridge, steep hills and old cable cars. Out in the bay lies the prison island of Alcatraz. Just south of the city is Silicon Valley, home to companies like Apple and Google. In 1906 the city was destroyed by a huge earthquake."}},
{id:"lasvegas",cc:"US",la:36.17,lo:-115.14,lm:"AM",port:0,pr:120,
 no:{n:"Las Vegas",item:"Spillkort-kortstokk",fact:"Las Vegas ligger midt i Mojave-ørkenen og er kjent for gigantiske hoteller, show og lys som kan sees fra verdensrommet. Ikke langt unna ligger Hoover-demningen og Grand Canyon, en kløft som er opptil 1,8 km dyp."},
 en:{n:"Las Vegas",item:"Deck of playing cards",fact:"Las Vegas lies in the middle of the Mojave Desert and is famous for giant hotels, shows and lights that can be seen from space. Not far away are the Hoover Dam and the Grand Canyon, a gorge up to 1.8 km deep."}},
{id:"miami",cc:"US",la:25.76,lo:-80.19,lm:"AM",port:1,pr:150,
 no:{n:"Miami",item:"Flamingo-figur",fact:"Miami ligger sør i Florida og har mange innbyggere med røtter fra Cuba og Latin-Amerika. Byen er kjent for strender, art deco-hus i pastellfarger og cruiseskip. Like ved ligger Everglades, en stor sumpskog med alligatorer."},
 en:{n:"Miami",item:"Flamingo figure",fact:"Miami lies in southern Florida and has many residents with roots in Cuba and Latin America. The city is famous for beaches, pastel art deco buildings and cruise ships. Nearby is the Everglades, a huge swamp with alligators."}},
{id:"vancouver",cc:"CA",la:49.28,lo:-123.12,lm:"AM",port:1,pr:150,
 no:{n:"Vancouver",item:"Totempæl-miniatyr",fact:"Vancouver ligger mellom havet og snødekte fjell, og du kan gå på ski og bade samme dag. I Stanley Park står flotte totempæler laget av urfolket ved kysten. Byen arrangerte vinter-OL i 2010."},
 en:{n:"Vancouver",item:"Mini totem pole",fact:"Vancouver lies between the sea and snowy mountains, and you can ski and swim on the same day. In Stanley Park stand beautiful totem poles made by the coastal Indigenous peoples. The city hosted the 2010 Winter Olympics."}},
{id:"cancun",cc:"MX",la:21.16,lo:-86.85,lm:"AM",port:1,pr:110,
 no:{n:"Cancún",item:"Maya-kalender",fact:"Cancún ligger på Yucatán-halvøya ved Det karibiske hav, med kritthvite strender. I nærheten finnes maya-pyramiden Chichén Itzá og cenoter – naturlige brønner med krystallklart vann der man kan bade og dykke."},
 en:{n:"Cancún",item:"Maya calendar",fact:"Cancún lies on the Yucatán Peninsula by the Caribbean Sea, with chalk-white beaches. Nearby are the Maya pyramid of Chichén Itzá and cenotes – natural wells with crystal-clear water where you can swim and dive."}},
{id:"cusco",cc:"PE",la:-13.53,lo:-71.97,lm:"AM",port:0,pr:120,
 no:{n:"Cusco",item:"Inka-terrassemodell",fact:"Cusco var hovedstaden i Inkariket og ligger 3400 meter over havet. Spanjolene bygde kirker oppå inkaenes steinmurer, som er så presise at man ikke får et papirark mellom steinene. Herfra starter turen til Machu Picchu."},
 en:{n:"Cusco",item:"Inca terrace model",fact:"Cusco was the capital of the Inca Empire and lies 3400 metres above sea level. The Spanish built churches on top of the Inca stone walls, which are so precise you can't fit a sheet of paper between the stones. The journey to Machu Picchu starts here."}},
{id:"manaus",cc:"BR",la:-3.12,lo:-60.02,lm:"AM",port:1,pr:130,
 no:{n:"Manaus",item:"Papegøyefjær-smykke",fact:"Manaus ligger midt i Amazonas-regnskogen og kan nesten bare nås med fly eller båt. Under gummiboomen rundt 1900 ble byen så rik at de bygde et praktfullt operahus. Rett utenfor byen møtes to elver med ulik farge uten å blande seg på flere kilometer."},
 en:{n:"Manaus",item:"Parrot feather jewellery",fact:"Manaus lies in the middle of the Amazon rainforest and can almost only be reached by plane or boat. During the rubber boom around 1900 the city became so rich that they built a magnificent opera house. Just outside the city two rivers of different colours meet without mixing for several kilometres."}},

function decodeWorld(geo){
  const scale=geo.UTF8Scale||1024;
  const dec=(str,off)=>{const out=[];let px=off[0],py=off[1];
    for(let i=0;i<str.length;i+=2){let x=str.charCodeAt(i)-64,y=str.charCodeAt(i+1)-64;x=(x>>1)^(-(x&1));y=(y>>1)^(-(y&1));x+=px;y+=py;px=x;py=y;out.push([x/scale,y/scale]);}
    return out;};
  const res=[];
  geo.features.forEach(f=>{
    const g=f.geometry;if(!g)return;let polys=[];
    if(geo.UTF8Encoding&&g.encodeOffsets){
      if(g.type==='Polygon')polys=[g.coordinates.map((r,i)=>dec(r,g.encodeOffsets[i]))];
      else if(g.type==='MultiPolygon')polys=g.coordinates.map((p,j)=>p.map((r,i)=>dec(r,g.encodeOffsets[j][i])));
    }else{
      if(g.type==='Polygon')polys=[g.coordinates];else if(g.type==='MultiPolygon')polys=g.coordinates;
    }
    if(polys.length)res.push({name:(f.properties&&f.properties.name)||'',polys});
  });
  if(res.length<50)throw new Error('for få land');
  return res;
}

try{MUS.on=localStorage.getItem('globetrotter_music')!=='av';}catch(e){}
const mf=m=>440*Math.pow(2,(m-69)/12);
function ac(){AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();return AC;}
let NOISE=null;
function noiseBuf(){if(NOISE)return NOISE;const a=ac(),b=a.createBuffer(1,a.sampleRate*0.3,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;return NOISE=b;}
function setupMusic(){
  const a=ac();if(MUS.bus)return;
  MUS.bus=a.createGain();MUS.bus.gain.value=MUS.on?1:0;MUS.bus.connect(a.destination);
  const lp=a.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.connect(MUS.bus);
  MUS.lounge=a.createGain();MUS.lounge.gain.value=0.55;MUS.lounge.connect(lp);
  // litt romklang med ekko
  const dl=a.createDelay();dl.delayTime.value=0.33;const fb=a.createGain();fb.gain.value=0.28;
  MUS.lounge.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(lp);
}
function epiano(m,t,dur,vol){const a=AC;[0,7].forEach((det,i)=>{const o=a.createOscillator(),g=a.createGain();o.type=i?'triangle':'sine';o.frequency.value=mf(m);o.detune.value=i?det:-3;
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol*(i?0.35:1),t+0.02);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(MUS.lounge);o.start(t);o.stop(t+dur+0.05);});}
function bassN(m,t,dur){const o=AC.createOscillator(),g=AC.createGain();o.type='triangle';o.frequency.value=mf(m);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.22,t+0.015);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g);g.connect(MUS.lounge);o.start(t);o.stop(t+dur+0.05);}
function brush(t,vol){const s=AC.createBufferSource();s.buffer=noiseBuf();const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=7000;const g=AC.createGain();
  g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(0.0001,t+0.09);s.connect(f);f.connect(g);g.connect(MUS.lounge);s.start(t);s.stop(t+0.12);}
function vibes(m,t){const o=AC.createOscillator(),g=AC.createGain(),tr=AC.createOscillator(),tg=AC.createGain();o.type='sine';o.frequency.value=mf(m);
  tr.frequency.value=5.5;tg.gain.value=0.025;tr.connect(tg);tg.connect(g.gain);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.07,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+1.4);
  o.connect(g);g.connect(MUS.lounge);o.start(t);tr.start(t);o.stop(t+1.5);tr.stop(t+1.5);}
// Akkorder: Dmaj7 – Bm7 – Em7 – A7(13)  ·  rolig 82 bpm, swing
const CH=[[62,66,69,73],[59,62,66,69],[64,67,71,74],[61,64,67,71]],RT=[38,35,40,33];
const MEL=[74,76,78,81,83,86,88];
function scheduleStep(t){
  const beat=60/82,i=MUS.step,bar=Math.floor(i/8)%4,e=i%8;
  const sw=(e%2)?beat*0.17:0; // swing på åttendelene
  const tt=t+sw,ch=CH[bar];
  if(e===0)ch.forEach(m=>epiano(m,tt,beat*3.2,0.045));
  if(e===3)ch.forEach(m=>epiano(m+(bar===3?0:0),tt,beat*0.9,0.03));
  if(e===0)bassN(RT[bar],tt,beat*1.6);
  if(e===4)bassN(RT[bar]+7,tt,beat*1.2);
  if(e===7)bassN(RT[(bar+1)%4]+1,tt,beat*0.4);
  brush(tt,e%2?0.025:0.012);
  if(e%2===0&&Math.random()<0.22)vibes(rnd(MEL),tt);
  MUS.step++;
}
function musicTick(){if(!AC)return;const beat=60/82;while(MUS.next<AC.currentTime+0.15){scheduleStep(MUS.next);MUS.next+=beat/2;}}
function startMusic(){
  try{ac();setupMusic();if(MUS.started)return;MUS.started=true;MUS.next=AC.currentTime+0.1;MUS.timer=setInterval(musicTick,40);}catch(e){}
}
function setMusic(on){MUS.on=on;try{localStorage.setItem('globetrotter_music',on?'på':'av');}catch(e){}
  $('musicBtn').textContent=on?L('🎵 På','🎵 On'):L('🔇 Av','🔇 Off');
  if(on)startMusic();
  if(MUS.bus)MUS.bus.gain.setTargetAtTime(on?1:0,AC.currentTime,0.1);}
// Dyster «mordmusikk» når noe går galt
function murderSting(){
  if(!MUS.on)return;try{ac();setupMusic();}catch(e){return;}
  const a=AC,t=a.currentTime+0.05,out=a.createGain();out.gain.value=0.9;out.connect(MUS.bus);
  MUS.lounge.gain.cancelScheduledValues(t);MUS.lounge.gain.setTargetAtTime(0.0001,t,0.08);
  // lav, truende drone (to toner som skurrer mot hverandre)
  [41,42].forEach(m=>{const o=a.createOscillator(),f=a.createBiquadFilter(),g=a.createGain();o.type='sawtooth';o.frequency.value=mf(m);
    f.type='lowpass';f.frequency.setValueAtTime(200,t);f.frequency.linearRampToValueAtTime(900,t+2.5);
    g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.12,t+0.6);g.gain.setValueAtTime(0.12,t+2.6);g.gain.exponentialRampToValueAtTime(0.0001,t+3.6);
    o.connect(f);f.connect(g);g.connect(out);o.start(t);o.stop(t+3.7);});
  // tre skarpe, skjærende stikk
  [0,0.45,0.9].forEach((d,k)=>{[69,70,76].forEach(m=>{const o=a.createOscillator(),g=a.createGain();o.type='sawtooth';o.frequency.value=mf(m+k);
    g.gain.setValueAtTime(0.0001,t+d);g.gain.exponentialRampToValueAtTime(0.06,t+d+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.3);
    o.connect(g);g.connect(out);o.start(t+d);o.stop(t+d+0.35);});});
  // dyp pauke-dunk
  [0,1.8].forEach(d=>{const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(90,t+d);o.frequency.exponentialRampToValueAtTime(35,t+d+0.6);
    g.gain.setValueAtTime(0.5,t+d);g.gain.exponentialRampToValueAtTime(0.0001,t+d+0.9);o.connect(g);g.connect(out);o.start(t+d);o.stop(t+d+1);});
  // synkende, uhyggelig tone til slutt
  {const o=a.createOscillator(),g=a.createGain();o.type='triangle';o.frequency.setValueAtTime(mf(75),t+1.4);o.frequency.exponentialRampToValueAtTime(mf(63),t+3.2);
   g.gain.setValueAtTime(0.0001,t+1.4);g.gain.exponentialRampToValueAtTime(0.07,t+1.6);g.gain.exponentialRampToValueAtTime(0.0001,t+3.4);o.connect(g);g.connect(out);o.start(t+1.4);o.stop(t+3.5);}
  // loungen kommer rolig tilbake
  MUS.lounge.gain.setTargetAtTime(0.55,t+4,0.8);
}

function sleepAt(k){
  const c=byId[S.at],o=nightOpts(c).find(x=>x.k===k);if(!o||S.money<o.price)return;
  S.money-=o.price;S.stay.nights++;
  S.nightsLeft=Math.max(0,(S.nightsLeft||1)-1);
  const more=S.nightsLeft>0;
  if(more){S.needNight=true;S.day++;}else S.needNight=false;
  const nextBtn=more?`<button class="btn blue" onclick="openNight()">😴 ${L('Sov ut en natt til','Sleep one more night')}</button>`:'';
  let h,txt;
  if(Math.random()<o.risk&&(S.money>0||bagCount()>0)){
    const lost=Math.min(S.money,Math.max(100,Math.round(S.money*(0.3+Math.random()*0.2))));
    S.money-=lost;let item='';
    if(bagCount()>0&&Math.random()<0.5){const key=rnd(Object.keys(S.inv));item=itemName(key);S.inv[key]--;if(!S.inv[key])delete S.inv[key];}
    murderSting();
    const where={hotell:L('Noen dirket opp døra til hotellrommet i natt!','Someone picked the lock of your hotel room last night!'),hostell:L('En på sovesalen rotet i sekken din mens du sov!','Someone in the dorm went through your bag while you slept!'),ute:L('Mens du sov på benken, kom en skummel skikkelse snikende …','While you slept on the bench, a creepy figure came sneaking up …')}[k];
    const and=L(' og ',' and ');
    txt=L(`Ble ranet i ${cn(c.id)}! Mistet ${kr(lost)}${item?and+item:''}.`,`Robbed in ${cn(c.id)}! Lost ${kr(lost)}${item?and+item:''}.`);
    h=`<h2 style="color:#000">🔪 ${L('RANET!','ROBBED!')}</h2><div class="fact" style="background:#2b2118;color:#f3c1bb">${where}<br><br>${L('Du mistet','You lost')} <b>${kr(lost)}</b>${item?and+'<b>'+item+'</b>'+L(' fra ryggsekken',' from your backpack'):''}.</div><p class="small">${L('Tips: Hotell er tryggest – men koster mer.','Tip: A hotel is the safest – but costs more.')}</p>${more?nextBtn:`<button class="btn" onclick="closeModal()">${L('Puh … en ny dag','Phew … a new day')}</button>`}`;
  }else{
    const good={hotell:L('Du sov som en stein i en myk hotellseng. Frokosten var nydelig!','You slept like a log in a soft hotel bed. Breakfast was lovely!'),hostell:L('Litt snorking fra køya over, men du sov greit.','A bit of snoring from the bunk above, but you slept fine.'),ute:L('Stjernene lyste, og ingen plaget deg. Du våknet stiv i ryggen, men med alt i behold.','The stars were shining and nobody bothered you. You woke up stiff, but with everything still there.')}[k];
    txt=L(`Sov på ${o.n.toLowerCase()} i ${cn(c.id)}${o.price?' for '+kr(o.price):''}.`,`Slept ${k==='ute'?'outside':'at a '+o.n.toLowerCase()} in ${cn(c.id)}${o.price?' for '+kr(o.price):''}.`);
    h=`<h2>☀️ ${L('God morgen!','Good morning!')}</h2><div class="fact">${o.ic} ${good}</div>${o.price?`<p>${L('Du betalte','You paid')} ${kr(o.price)}.</p>`:''}${more?`<p><b>😴 ${L('Du er fortsatt sliten etter den lange reisen.','You are still tired after the long journey.')}</b></p>`+nextBtn:`<button class="btn green" onclick="closeModal()">${L('Ut og opplev','Go and explore')} ${cn(c.id)}!</button>`}`;
  }
  diary(txt);render();modal(h);
}

/* --- Jobb: velg mellom 4 jobber --- */
let JOB=null;
function jobsFor(cc){
  const co=COUNTRIES[cc];
  const mk=(j,own)=>({ic:j.ic,t:L(j.no,j.en),th:L(j.tn,j.te),own,q:j.q.map(r=>LANG==='en'?r.slice(4,8):r.slice(0,4))});
  let list=[{ic:'🗺️',t:L('Turistguide','Tour guide'),th:L('landet','the country'),q:[]}].concat(co.jobs.map((j,i)=>mk({ic:j.ic,no:j.no,en:j.en,tn:j.tn,te:j.te,q:j.q.concat((XQ[cc]||[])[i]||[])},true)));
  if(!GAMER.skip.includes(cc))list.push(mk(GAMER,true));
  return list;
}
function openJob(){
  const c=byId[S.at],co=CO(c.cc);
  let h=`<h2>💼 ${L('Ledige jobber i','Jobs available in')} ${co.n}</h2><p class="small">${L('Hver jobb tar én dag. Du får 5–10 spørsmål om jobbens tema og må ha 80 % riktig for å få lønn.','Each job takes one day. You get 5–10 questions on the job\'s topic and need 80% correct to get paid.')}</p><p><span class="tag">${wageLevel(c.cc)}</span><span class="tag">${L('Opptil','Up to')} ${kr(r50(10*c.p*0.5))} ${L('per dag','per day')}</span></p><div class="jobs">`;
  jobsFor(c.cc).forEach((j,i)=>{h+=`<button class="jobcard" onclick="startJob(${i})"><span>${j.ic}</span><b>${j.t}</b><small>${L('Spørsmål om','Questions about')} ${j.th}</small></button>`;});
  h+=`</div><button class="btn gray" onclick="closeModal()">${L('Tilbake','Back')}</button>`;
  modal(h);
}
function startJob(i){
  const c=byId[S.at],t=CT(c.id),j=jobsFor(c.cc)[i];
  const n=5+Math.floor(Math.random()*6);
  if(j.own){const m=Math.min(n,j.q.length);JOB={ji:i,ic:j.ic,title:j.t,qs:shuffle(j.q).slice(0,m),i:0,right:0,n:m,need:Math.ceil(m*0.8),pay:r50(m*c.p*0.5)};return jobIntro(j);}
  const gen=n>=8?1:0;
  const themed=shuffle(j.q).slice(0,Math.min(j.q.length,n-gen));
  const fill=shuffle(countryPool(c.cc)).slice(0,n-gen-themed.length);
  const qs=themed.concat(fill).concat(shuffle(GEN()).slice(0,gen));
  const need=Math.ceil(n*0.8), pay=r50(n*c.p*0.5);
  JOB={ji:i,ic:j.ic,title:j.t,qs:shuffle(qs),i:0,right:0,n:qs.length,need:Math.ceil(qs.length*0.8),pay:r50(qs.length*c.p*0.5)};
  jobIntro(j);
}
function jobIntro(j){
  const n=JOB.n,need=JOB.need,pay=JOB.pay;
  modal(`<h2>${j.ic} ${j.t}</h2>
  <div class="fact">${L(`Sjefen vil teste hva du kan om <b>${j.th}</b>. Du får <b>${n} spørsmål</b> og må ha minst <b>${need} riktige (80 %)</b> for å få lønn.`,`The boss wants to test what you know about <b>${j.th}</b>. You get <b>${n} questions</b> and need at least <b>${need} correct (80%)</b> to get paid.`)}<br><br>💰 ${L('Lønn','Pay')}: <b>${kr(pay)}</b><br>❌ ${L('Klarer du det ikke, får du ingenting.','If you fail, you get nothing.')}</div>
  <p class="small">${L('Etterpå må du finne et sted å sove.','Afterwards you need somewhere to sleep.')}</p>
  <button class="btn green" onclick="jobQ()">${L('Start arbeidsdagen','Start the working day')}</button>
  <button class="btn gray" onclick="openJob()">${L('Velg en annen jobb','Choose another job')}</button>`);
}
function jobQ(){
  const q=JOB.qs[JOB.i];const opts=shuffle(q.slice(1));
  let h=`<h2>${JOB.ic} ${L('Spørsmål','Question')} ${JOB.i+1} ${L('av','of')} ${JOB.n}</h2><p class="small">${L('Riktige så langt','Correct so far')}: ${JOB.right} · ${L('Du trenger','You need')} ${JOB.need}</p><div class="q">${q[0]}</div>`;
  opts.forEach(o=>{h+=`<button class="ans" data-o="${encodeURIComponent(o)}">${o}</button>`;});
  h+='<div id="jobfb"></div>';
  modal(h);
  document.querySelectorAll('.ans').forEach(b=>b.onclick=()=>{
    const ok=decodeURIComponent(b.dataset.o)===q[1];

  });
}
function jobEnd(){

const HOME_HI=()=>L(['Mamma: «Hei vennen! Har du husket å spise ordentlig?»','Pappa: «Jaså, er det deg? Hvor i all verden er du nå?»','Mamma: «Så hyggelig at du ringer! Har du det fint?»','Pappa: «Hallo? Det skurrer litt … er du i utlandet fortsatt?»','Mamma: «Har du med deg nok ullsokker?»'],
 ['Mum: «Hi sweetheart! Have you remembered to eat properly?»','Dad: «Oh, is that you? Where in the world are you now?»','Mum: «How lovely that you called! Are you having fun?»','Dad: «Hello? The line is crackling … are you still abroad?»','Mum: «Have you packed enough wool socks?»']);
const HOME_LOAN=()=>L(['Pappa: «Greit da, jeg setter inn 1000 kr. Men du må betale tilbake, hører du!»','Mamma: «Selvfølgelig, vennen. 1000 kr er på vei. Ikke bruk alt på suvenirer!»','Pappa: «Hmm … OK. 1000 kr. Jeg skriver det opp i boka.»'],
 ['Dad: «Alright then, I\'ll send 1000 kr. But you have to pay it back, you hear!»','Mum: «Of course, sweetheart. 1000 kr is on its way. Don\'t spend it all on souvenirs!»','Dad: «Hmm … OK. 1000 kr. I\'m writing it down in my little book.»']);
function openHome(){
  const debt=S.debt||0;ring();

function ring(){[0,.35,1.2,1.55].forEach(d=>{beep(880,.25,'sine',.05,d);beep(1100,.25,'sine',.03,d);});}
function borrow(){if((S.debt||0)>=3000)return;S.debt=(S.debt||0)+1000;S.money+=1000;sndCoin();

function repay(){if(!S.debt||S.money<1000)return;S.debt-=1000;S.money-=1000;sndOk();diary(L('Betalte tilbake 1000 kr til mamma og pappa.','Paid back 1000 kr to Mum and Dad.'));render();

/* --- Marked: byens suvenir + landets egne varer --- */

function buyItem(k){const it=itemInfo(k);if(S.money<it.price||bagCount()>=MAXBAG)return;S.money-=it.price;S.inv[k]=(S.inv[k]||0)+1;sndCoin();
  diary(L(`Kjøpte ${it.name} i ${cn(S.at)} for ${kr(it.price)}.`,`Bought ${it.name} in ${cn(S.at)} for ${kr(it.price)}.`));toast(L('Lagt i ryggsekken: ','Added to backpack: ')+it.name);render();openMarket();}

/* --- Oppdrag --- */
function makeOffers(){
  const offers=[];let tries=0;
  while(offers.length<3&&tries<150){tries++;
    const from=rnd(CITIES),to=rnd(CITIES);
    if(from.id===to.id||to.id===S.at||from.cc===to.cc)continue;
    if(offers.some(o=>o.from===from.id||o.to===to.id))continue;
    if(S.missions.some(m=>m.from===from.id&&m.to===to.id))continue;
    const d=dist(from,to)+dist(byId[S.at],from);
    offers.push({id:S.seq++,from:from.id,to:to.id,who:rnd(PEOPLE),reward:r50(650+from.pr*1.3+d*0.09)});
  }
  S.offers=offers;
}
function missionText(m){const f=byId[m.from],t=byId[m.to];
  return L(`Kjøp <b>${itemName(m.from)}</b> i <span class="fl">${f.f}</span> ${cn(f.id)} og lever den til <b>${m.who}</b> i <span class="fl">${t.f}</span> ${cn(t.id)}.`,`Buy <b>${itemName(m.from)}</b> in <span class="fl">${f.f}</span> ${cn(f.id)} and deliver it to <b>${m.who}</b> in <span class="fl">${t.f}</span> ${cn(t.id)}.`);}
function openBoard(){
  const c=byId[S.at];let h=`<h2>📌 ${L('Oppslagstavla i','Notice board in')} ${cn(c.id)}</h2>`;
  S.missions.filter(m=>m.to===S.at&&(S.inv[m.from]||0)>0).forEach(m=>{h+=`<div class="mission" style="border-color:var(--green)">🎉 ${m.who} ${L('venter på deg her!','is waiting for you here!')} ${missionText(m)}<br><button class="btn green" onclick="deliver(${m.id})">${L('Lever og få','Deliver and get')} ${kr(m.reward)}</button></div>`;});
  h+=`<p><b>${L('Nye oppdrag','New missions')}</b> (${L(`du kan ha ${MAXMIS} om gangen – du har ${S.missions.length}`,`you can have ${MAXMIS} at a time – you have ${S.missions.length}`)}):</p>`;
  if(!S.offers.length)h+=`<p class="small">${L('Ingen nye oppdrag her akkurat nå.','No new missions here right now.')}</p>`;
  S.offers.forEach(o=>{h+=`<div class="mission">✉️ ${missionText(o)}<br><span class="tag">${L('Belønning','Reward')}: ${kr(o.reward)}</span><br><button class="mini blue" style="margin-top:6px" onclick="accept(${o.id})" ${S.missions.length>=MAXMIS?'disabled':''}>${L('Ta oppdraget','Accept mission')}</button></div>`;});
  h+=`<button class="btn gray" onclick="closeModal()">${L('Tilbake','Back')}</button>`;
  modal(h);
}
function accept(id){const o=S.offers.find(x=>x.id===id);if(!o||S.missions.length>=MAXMIS)return;S.missions.push(o);S.offers=S.offers.filter(x=>x.id!==id);sndOk();
  diary(L(`Nytt oppdrag: hente ${itemName(o.from)} i ${cn(o.from)} til ${o.who} i ${cn(o.to)}.`,`New mission: bring ${itemName(o.from)} from ${cn(o.from)} to ${o.who} in ${cn(o.to)}.`));render();openBoard();}
function deliver(id){
  const m=S.missions.find(x=>x.id===id);if(!m||!(S.inv[m.from]>0))return;
  S.inv[m.from]--;if(!S.inv[m.from])delete S.inv[m.from];
  S.missions=S.missions.filter(x=>x.id!==id);S.money+=m.reward;S.done++;sndCoin();setTimeout(sndOk,250);
  diary(L(`${m.who} ble kjempeglad for ${itemName(m.from)}! Du fikk ${kr(m.reward)}.`,`${m.who} was thrilled with the ${itemName(m.from)}! You got ${kr(m.reward)}.`));
  render();
  if(S.done>=GOAL){win();return;}
  modal(`<h2>🎉 ${L('Oppdrag fullført!','Mission complete!')}</h2><p class="big">${m.who} ${L('takker så mye!','says thank you!')}</p><p class="big" style="color:var(--green)">+ ${kr(m.reward)}</p><p class="big">${S.done} ${L('av','of')} ${GOAL} ${L('oppdrag ferdig','missions done')}</p><button class="btn green" onclick="openBoard()">${L('Tilbake til tavla','Back to the board')}</button>`);
}

/* --- Reise --- */
function modes(a,b){
  const d=dist(a,b),list=[];
  list.push({k:'fly',ic:'✈️',n:L('Fly','Plane'),price:r50(300+d*0.12),days:d>7000?2:1});
  if(a.lm===b.lm&&d<9000)list.push({k:'tog',ic:'🚆',n:L('Tog / buss','Train / bus'),price:r50(100+d*0.06),days:Math.max(1,Math.ceil(d/900))});
  if(a.port&&b.port)list.push({k:'baat',ic:'🚢',n:L('Båt','Boat'),price:r50(100+d*0.035),days:Math.max(1,Math.ceil(d/650))});
  return list;
}
let TRAVEL_F='all';
function openTravel(f){
  if(f)TRAVEL_F=f;
  const a=byId[S.at];
  const conts=[['all',L('Alle','All')],['EU','Europa'],['AS',L('Asia','Asia')],['AF',L('Afrika','Africa')],['NA',L('Nord-Am.','N. America')],['SA',L('Sør-Am.','S. America')],['OC',L('Oseania','Oceania')]];
  const list=CITIES.filter(c=>c.id!==S.at&&(TRAVEL_F==='all'||c.k===TRAVEL_F)).map(c=>({c,d:dist(a,c)})).sort((x,y)=>x.d-y.d);
  let h=`<h2>✈️ ${L('Hvor vil du reise?','Where do you want to go?')}</h2><div class="chips">${conts.map(([k,t])=>`<button class="chip ${TRAVEL_F===k?'on':''}" onclick="openTravel('${k}')">${t}</button>`).join('')}</div>${canLeave()?'':`<div class="stay" style="margin:6px 0">${leaveText()}</div>`}<p class="small">${L('Du kan også trykke på en prikk på kartet. 🟡 = kjøp ting der · 🟢 = lever ting der','You can also tap a dot on the map. 🟡 = buy an item there · 🟢 = deliver an item there')}</p>`;
  list.forEach(({c,d})=>{
    const buy=S.missions.some(m=>m.from===c.id&&!(S.inv[m.from]>0)),drop=S.missions.some(m=>m.to===c.id&&S.inv[m.from]>0);
    const cheapest=Math.min(...modes(a,c).map(m=>m.price));
    const lk=c.cc!==S.stay.cc&&!canLeave();
    h+=`<div class="row"><div>${lk?'🔒 ':''}<span class="fl">${c.f}</span> <b>${cn(c.id)}</b> ${buy?'🟡':''}${drop?'🟢':''}${S.visited.includes(c.id)?' <span class="small">✔</span>':''}<div class="small">${CT(c.id).c} · ${km(d)} · ${L('fra','from')} ${kr(cheapest)}</div></div><button class="mini blue" onclick="openTravelTo('${c.id}')">${L('Velg','Choose')}</button></div>`;
  });
  modal(h);
}
function canLeave(){return S.stay.nights>=1&&S.stay.jobs>=2;}
function leaveText(){const co=CO(S.stay.cc);const n=Math.min(S.stay.nights,1),j=Math.min(S.stay.jobs,2);
  return `${L('For å reise ut av','To leave')} ${co.n}: <span class="${n>=1?'ok':'no'}">🌙 ${n}/1 ${L('natt','night')}</span> · <span class="${j>=2?'ok':'no'}">💼 ${j}/2 ${L('jobber','jobs')}</span>`;}
function openTravelTo(id){
  const a=byId[S.at],b=byId[id],d=dist(a,b),ms=modes(a,b);
  const locked=b.cc!==S.stay.cc&&!canLeave();
  let h=`<h2><span class="fl">${b.f}</span> ${L('Reise til','Travel to')} ${cn(b.id)}</h2><p>${cn(a.id)} → ${cn(b.id)} (${CT(b.id).c}): <b>${km(d)}</b></p>`;
  ms.forEach(m=>{h+=`<div class="row"><div><span style="font-size:24px">${m.ic}</span> <b>${m.n}</b><div class="small">${days(m.days)} · ${kr(m.price)}</div></div><button class="mini" ${S.money<m.price||locked?'disabled':''} onclick="travel('${id}','${m.k}')">${L('Kjøp billett','Buy ticket')}</button></div>`;});
  if(locked)h+=`<div class="fact" style="border-color:var(--red)">🔒 <b>${L('Du kan ikke forlate landet ennå.','You cannot leave the country yet.')}</b><br>${leaveText()}<br><span class="small">${L('Du kan fortsatt reise til andre steder i samme land.','You can still travel to other places in the same country.')}</span></div>`;
  else if(!ms.some(m=>S.money>=m.price))h+=`<p class="small" style="color:var(--red)"><b>${L('Du har ikke råd til billett. Ta en jobb eller ring hjem!','You can\'t afford a ticket. Get a job or call home!')}</b></p>`;
  if(a.lm!==b.lm)h+=`<p class="small">${L('Tog går ikke over havet. Båt går bare mellom havnebyer ⚓.','Trains don\'t cross the sea. Boats only go between port cities ⚓.')}</p>`;
  h+=`<button class="btn gray" onclick="openTravel()">${L('Velg et annet sted','Choose another place')}</button>`;
  modal(h);
}
let busy=false,SKIP=false;
function travel(id,k){
  if(busy)return;const a=byId[S.at],b=byId[id];const m=modes(a,b).find(x=>x.k===k);
  if(!m||S.money<m.price)return;
  busy=true;SKIP=false;$('modal').classList.add('hidden');S.money-=m.price;render();
  const [x1,y1]=P(a.lo,a.la),[x2,y2]=P(b.lo,b.la);const d=dist(a,b);
  $('routes').innerHTML=`<line class="route" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/><line id="rdone" class="route done" x1="${x1}" y1="${y1}" x2="${x1}" y2="${y1}"/>`;
  const pl=$('plane');pl.textContent=m.ic;pl.classList.remove('hidden');pl.setAttribute('font-size',m.k==='fly'?16:14);
  const ang=Math.atan2(y2-y1,x2-x1)*180/Math.PI;
  const tb=$('travelbar');tb.classList.remove('hidden');$('tbIc').textContent=m.ic;
  const dur=Math.min(9000,2500+d*0.6),t0=performance.now();const wrap=$('mapwrap');
  beep(300,.4,'triangle',.05);
  function step(t){
    const p=SKIP?1:Math.min(1,(t-t0)/dur),e=p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
    const x=x1+(x2-x1)*e,y=y1+(y2-y1)*e-(m.k==='fly'?Math.sin(p*Math.PI)*12:0);
    pl.setAttribute('x',x);pl.setAttribute('y',y);
    pl.setAttribute('transform',m.k==='fly'?`rotate(${ang+45} ${x} ${y})`:'');
    const rd=$('rdone');if(rd){rd.setAttribute('x2',x1+(x2-x1)*e);rd.setAttribute('y2',y1+(y2-y1)*e);}
    const sc=svg.clientWidth/1000;wrap.scrollLeft=x*sc-wrap.clientWidth/2;wrap.scrollTop=y*sc-wrap.clientHeight/2;
    const dayNow=Math.min(m.days,Math.floor(p*m.days)+1);
    $('tbText').textContent=`${cn(a.id)} → ${cn(b.id)} · ${L('Dag','Day')} ${S.day+dayNow-1} · ${Math.round(e*d).toLocaleString(LANG==='en'?'en-GB':'nb-NO')} / ${km(d)}`;
    $('tbBar').style.width=(e*100)+'%';
    if(p<1)requestAnimationFrame(step);else{pl.classList.add('hidden');tb.classList.add('hidden');$('routes').innerHTML='';arrive(id,m);}}
  requestAnimationFrame(step);
}
function arrive(id,m){
  busy=false;const dd=dist(byId[S.at],byId[id]);S.at=id;S.day+=m.days;const c=byId[id],t=CT(id);
  if(c.cc!==S.stay.cc)S.stay={cc:c.cc,nights:0,jobs:0};
  const tired=dd>7000||m.days>=3;S.nightsLeft=S.nightsTotal=tired?2:1;
  let stamp=false;
  if(!S.visited.includes(id)){S.visited.push(id);S.stampDay[id]=S.day;stamp=true;}
  let ev='';
  if(Math.random()<0.3){const e=rnd(EVL());S.money=Math.max(0,S.money+e[1]);if(e[1]<0)setTimeout(murderSting,600);ev=e[0]+(e[1]?` (${e[1]>0?'+':''}${kr(e[1])})`:'');}
  S.needNight=true;makeOffers();
  diary(L(`Kom fram til ${t.n} etter ${days(m.days)} med ${m.n.toLowerCase()}.`,`Arrived in ${t.n} after ${days(m.days)} by ${m.n.toLowerCase()}.`));
  render();
  const canDeliver=S.missions.some(x=>x.to===id&&(S.inv[x.from]||0)>0);
  let h=`<h2><span class="fl">${c.f}</span> ${L('Velkommen til','Welcome to')} ${t.n}!</h2>`;
  if(stamp){sndStamp();h+=`<div style="text-align:center"><div class="stamp" style="display:inline-block;padding:10px 18px;font-size:16px"><div class="f"><span class="fl">${c.f}</span></div>${t.n.toUpperCase()}<br>${L('Dag','Day')} ${S.day}</div><p><b>${L('Nytt stempel i passet!','New stamp in your passport!')}</b></p></div>`;}
  h+=`<div class="fact">${t.fact}</div>`;
  if(ev)h+=`<p><b>📰 ${ev}</b></p>`;
  if(tired)h+=`<div class="fact" style="margin-top:10px">😴 <b>${L('Du er helt utslitt etter den lange reisen (jetlag)!','You are completely worn out after the long journey (jet lag)!')}</b> ${L('Du må sove ut i 2 netter før du er klar igjen.','You need to sleep for 2 nights before you are ready again.')}</div>`;
  if(canDeliver)h+=`<button class="btn green" onclick="openBoard()">🎉 ${L('Noen venter på en leveranse her!','Someone is waiting for a delivery here!')}</button>`;
  h+=`<button class="btn blue" onclick="openNight()">🌙 ${L('Finn overnatting i','Find a place to sleep in')} ${t.n}</button>`;
  modal(h);
}

/* --- Ryggsekk --- */
function openBag(){
  let h=`<h2>🎒 ${L('Ryggsekken','Backpack')}</h2>`+((S.debt||0)>0?`<p>📞 ${L('Du skylder hjemme','You owe at home')}: <b>${kr(S.debt)}</b></p>`:'');
  const items=Object.entries(S.inv);
  h+=`<p><b>${L('Ting','Items')} (${bagCount()}/${MAXBAG}):</b></p>`;
  if(!items.length)h+=`<p class="small">${L('Ryggsekken er tom.','Your backpack is empty.')}</p>`;
  items.forEach(([k,n])=>{const it=itemInfo(k);h+=`<div class="row"><div><span class="fl">${COUNTRIES[it.cc].f}</span> ${it.name} ${n>1?'× '+n:''}</div><button class="mini gray" onclick="sellItem('${k}')">${L('Selg','Sell')} ${kr(sellPrice(k))}</button></div>`;});
  h+=`<p><b>${L('Mine oppdrag','My missions')} (${S.missions.length}/${MAXMIS}):</b></p>`;
  if(!S.missions.length)h+=`<p class="small">${L('Ingen oppdrag. Se på oppslagstavla!','No missions. Check the notice board!')}</p>`;
  S.missions.forEach(m=>{const has=(S.inv[m.from]||0)>0;h+=`<div class="mission">${has?'🟢 '+L('Har tingen – lever i ','Got it – deliver in ')+cn(m.to):'🟡 '+L('Må kjøpes i ','Buy it in ')+cn(m.from)}<br>${missionText(m)}<br><span class="tag">${L('Belønning','Reward')}: ${kr(m.reward)}</span> <button class="mini red" style="margin-top:6px" onclick="dropMission(${m.id})">${L('Avbryt','Cancel')}</button></div>`;});
  h+=`<button class="btn gray" onclick="closeModal()">${L('Lukk','Close')}</button>`;
  modal(h);
}
function sellItem(k,fromMarket){if(!S.inv[k])return;const v=sellPrice(k),name=itemName(k);S.inv[k]--;if(!S.inv[k])delete S.inv[k];S.money+=v;sndCoin();
  diary(L(`Solgte ${name} for ${kr(v)}.`,`Sold ${name} for ${kr(v)}.`));render();fromMarket?openMarket():openBag();}
function dropMission(id){S.missions=S.missions.filter(m=>m.id!==id);diary(L('Du ga opp et oppdrag.','You gave up a mission.'));render();openBag();}

/* --- CV --- */
function openCV(){
  const cv=S.cv||[];
  let h=`<h2>📄 ${L('CV for','CV of')} ${S.name}</h2><p>${L('Jobber du har klart','Jobs you have passed')}: <b>${cv.length}</b> · ${L('Land','Countries')}: <b>${new Set(cv.map(x=>x.cc)).size}</b></p>`;
  if(!cv.length)h+=`<p class="small">${L('CV-en er tom. Ta en jobb og få minst 80 % riktig, så havner den her!','Your CV is empty. Take a job and get at least 80% right, and it will appear here!')}</p>`;
  const by={};cv.forEach(x=>{(by[x.cc]=by[x.cc]||[]).push(x);});
  Object.keys(by).forEach(cc=>{const jl=jobsFor(cc);
    h+=`<div class="cvc"><h4><span class="fl">${COUNTRIES[cc].f}</span> ${CO(cc).n}</h4><ul style="margin:0;padding-left:20px">`+by[cc].map(x=>{const j=jl[x.ji]||jl[0];return `<li>${j.ic} <b>${j.t}</b> – ${cn(x.city)}, ${L('dag','day')} ${x.day}</li>`;}).join('')+`</ul></div>`;});
  h+=`<button class="btn gray" onclick="closeModal()">${L('Lukk','Close')}</button>`;
  modal(h);
}

/* --- Pass --- */
function openPass(){
  let h=`<h2>🛂 ${L('Passet til','Passport of')} ${S.name}</h2><p>${S.visited.length} ${L('av','of')} ${CITIES.length} ${L('steder besøkt','places visited')}</p><div class="stamps">`;
  CITIES.forEach(c=>{h+=S.visited.includes(c.id)?`<div class="stamp"><div class="f"><span class="fl">${c.f}</span></div>${cn(c.id)}<br>${L('Dag','Day')} ${S.stampDay[c.id]||1}</div>`:`<div class="stamp empty"><div class="f">❔</div>${cn(c.id)}</div>`;});
  h+=`</div><button class="btn gray" onclick="closeModal()">${L('Lukk','Close')}</button>`;
  modal(h);
}

/* --- Meny --- */
function openMenu(){
  modal(`<h2>⚙️ ${L('Meny','Menu')}</h2><p>${L('Spillet lagres automatisk.','The game saves automatically.')}</p>
  <p><b>${L('Språk','Language')}</b></p><div style="display:flex;gap:8px"><button class="mini ${LANG==='no'?'':'gray'}" onclick="setLang('no');openMenu()">Norsk</button><button class="mini ${LANG==='en'?'':'gray'}" onclick="setLang('en');openMenu()">English</button></div>
  <button class="btn blue" onclick="toStart()">${L('Til startskjermen','Back to start screen')}</button>
  <button class="btn" onclick="askRestart()">${L('Start helt på nytt','Start all over')}</button>
  <button class="btn gray" onclick="closeModal()">${L('Tilbake','Back')}</button>`);
}
function askRestart(){modal(`<h2>${L('Start på nytt?','Start over?')}</h2><p>${L('Reisen du holder på med forsvinner.','Your current journey will be lost.')}</p><button class="btn" onclick="clearSave();S=null;toStart();">${L('Ja, slett reisen','Yes, delete the journey')}</button><button class="btn gray" onclick="openMenu()">${L('Nei, avbryt','No, cancel')}</button>`);}

/* --- Seier --- */
function score(){return Math.max(0,S.done*1000+S.visited.length*150+Math.round((S.money-(S.debt||0))/5)-S.day*40);}
function win(){
  const sc=score();let hs=[];try{hs=JSON.parse(localStorage.getItem(HSKEY))||[];}catch(e){}
  hs.push({n:S.name,s:sc,d:S.day});hs.sort((a,b)=>b.s-a.s);hs=hs.slice(0,5);
  try{localStorage.setItem(HSKEY,JSON.stringify(hs));}catch(e){}
  clearSave();
  [523,659,784,1047].forEach((f,i)=>beep(f,.25,'square',.06,i*.15));
  modal(`<h2>🏆 ${L('Gratulerer','Congratulations')}, ${S.name}!</h2><p class="big">${L(`Du har fullført alle ${GOAL} oppdragene!`,`You have completed all ${GOAL} missions!`)}</p>
  <div class="fact">📅 ${L('Dager brukt','Days used')}: <b>${S.day}</b><br>🛂 ${L('Steder besøkt','Places visited')}: <b>${S.visited.length}</b><br>📄 ${L('Jobber på CV-en','Jobs on your CV')}: <b>${(S.cv||[]).length}</b><br>💰 ${L('Penger igjen','Money left')}: <b>${kr(S.money)}</b>${(S.debt||0)>0?'<br>📞 '+L('Gjeld hjemme','Debt at home')+': <b>'+kr(S.debt)+'</b>':''}</div>
  <p class="big">${L('Poengsum','Score')}: ${sc}</p>
  <button class="btn green" onclick="S=null;toStart()">${L('Til startskjermen','Back to start screen')}</button>`);
}

/* --- Start --- */
function showHS(){let hs=[];try{hs=JSON.parse(localStorage.getItem(HSKEY))||[];}catch(e){}
  $('hsBox').innerHTML=hs.length?`<b>🏆 ${L('Beste reisende','Best travellers')}</b><ol>`+hs.map(h=>`<li>${h.n} – ${h.s} ${L('poeng','points')} (${days(h.d)})</li>`).join('')+'</ol>':'';}
function toStart(){$('modal').classList.add('hidden');$('game').classList.add('hidden');$('start').classList.remove('hidden');$('contBtn').classList.toggle('hidden',!load());applyLang();}
function startGame(st){startMusic();S=st;if(S.debt==null)S.debt=0;if(!S.cv)S.cv=[];if(!S.stay)S.stay={cc:byId[S.at].cc,nights:1,jobs:2};$('start').classList.add('hidden');$('game').classList.remove('hidden');render();applyZoom();if(S.needNight)openNight();}
function beginNew(){
  S=newState($('pname').value.trim());makeOffers();startGame(S);
  modal(`<h2>🎒 ${L('God tur','Have a great trip')}, ${S.name}!</h2><div class="fact">${L(`Du står på Oslo S med 2000 kr i lomma og en tom ryggsekk.<br><br>1. Gå til <b>📌 Oppdrag</b> og ta et oppdrag.<br>2. Reis til stedet der tingen selges og kjøp den på <b>🛒 Marked</b>.<br>3. Reis videre og lever den.<br><br>Går du tom for penger? <b>💼 Ta en jobb</b>, <b>handle</b> med varer eller <b>📞 ring hjem</b>!<br>Les om landet og historien under <b>📖 Om landet</b>. Fullfør ${GOAL} oppdrag på færrest mulig dager.`,
   `You are standing at Oslo Central Station with 2000 kr and an empty backpack.<br><br>1. Go to <b>📌 Missions</b> and take a mission.<br>2. Travel to the place where the item is sold and buy it at the <b>🛒 Market</b>.<br>3. Travel on and deliver it.<br><br>Out of money? <b>💼 Get a job</b>, <b>trade</b> goods or <b>📞 call home</b>!<br>Read about the country and its history under <b>📖 About</b>. Complete ${GOAL} missions in as few days as possible.`)}</div>
  <button class="btn green" onclick="openBoard()">${L('Se oppslagstavla','See the notice board')}</button>`);
}
$('newBtn').onclick=()=>{
  if(load()){modal(`<h2>${L('Ny reise?','New journey?')}</h2><p>${L('Du har en reise som ikke er ferdig. Vil du starte en ny? Den gamle forsvinner.','You have an unfinished journey. Start a new one? The old one will be lost.')}</p><button class="btn" onclick="clearSave();$('modal').classList.add('hidden');beginNew()">${L('Ja, start ny reise','Yes, start a new journey')}</button><button class="btn green" onclick="$('modal').classList.add('hidden');$('contBtn').click()">${L('Nei, fortsett den gamle','No, continue the old one')}</button>`);return;}
  beginNew();
};
$('contBtn').onclick=()=>{const s=load();if(s)startGame(s);};
document.querySelectorAll('.act').forEach(b=>b.onclick=()=>{({about:openAbout,job:openJob,market:openMarket,board:openBoard,travel:()=>openTravel(),bag:openBag,pass:openPass,cv:openCV,home:openHome,menu:openMenu})[b.dataset.a]();});
document.querySelectorAll('.langbtn').forEach(b=>b.onclick=()=>setLang(b.dataset.l));
$('musicBtn').onclick=()=>setMusic(!MUS.on);
$('tbSkip').onclick=()=>{SKIP=true;};
$('zIn').onclick=()=>{ZOOM=Math.min(3,ZOOM+0.5);applyZoom();};
$('zOut').onclick=()=>{ZOOM=Math.max(1,ZOOM-0.5);applyZoom();};
window.addEventListener('resize',()=>{if(S)applyZoom();});
drawMap();toStart();loadWorld();
try{if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});}catch(e){}

</script>
</body>
</html>
